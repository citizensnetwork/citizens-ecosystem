<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Pinch zoom (tracker R9, founder yes 2026-10-15): the WEBSITE lets a citizen zoom the page, which
     a low-vision believer needs and WCAG 1.4.4 asks for. The map and the Map v2 sheet still own their
     own two-finger gestures (touch-action), so the page does not zoom under them. The Capacitor phone
     app keeps the old block (maximum-scale=1) until it has been tested on a phone: the tag below puts
     it back there only, in viewport.js (the first script, right after the base tag below, so its address resolves
     under the base path; a file, not an inline script, so the CSP needs no 'unsafe-inline', QA plan PR F3). It is
     async: a parser-blocking script here cost a whole round trip (about 150 ms on a slow phone connection) before
     anything else loaded, and on the web it changes nothing; in the native shell the file is local and runs at once.
     The native bridge sets window.Capacitor at document start, before it runs; if anything there fails the
     page stays zoomable. -->
<!-- Every screen has its own URL now (/discover, /e/<id>, /dashboard/events, ...), and the
     server serves this same file for all of them. Without a base, the relative script,
     style and vendor paths below would resolve under those paths (/e/app/store.jsx) and
     404. next.config.ts rewrites an explicit list of paths here, never a catch-all. -->
<base href="/" />
<script src="viewport.js" async></script>
<title>Citizens Connect</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<!-- Home-screen app (founder yes 2026-11-12): the manifest and the iPhone icon. Every path here and inside
     manifest.json is relative, so it resolves under the base tag above, which is /citizens/connect/ on 219.co.za.
     The icons are the crown on the manifest's background colour, full-bleed, the crown inside the maskable
     safe zone. manifestFiles.test.ts fails if a listed file goes missing or a path turns absolute. -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<!-- MapLibre GL JS — real geographic basemap (MapTiler tiles). v6 dropped the
     UMD build entirely (ESM-only, GHSA-jrc7-96c5-q579 security bump from 4.7.1
     — critical XSS in the attribution-control sanitizer, fixed in 6.4.1), so
     it's loaded as a module and attached to window.maplibregl — every call
     site in app/map.jsx already reads window.maplibregl.* defensively
     (`if (!window.maplibregl) return`) from inside a React effect, so it
     tolerates the module resolving a tick after this tag runs.
     VENDORED (not unpkg): the ESM build resolves its worker relative to its
     own import.meta.url (`new URL('./maplibre-gl-worker.mjs', import.meta.url)`),
     and the CSP only allows `worker-src 'self' blob:` — a cross-origin unpkg
     worker is correctly blocked, so both files are served same-origin instead.
     Re-sync from node_modules/maplibre-gl/dist/ on every version bump.
     DEFERRED (QA plan PR F1, founder yes 2026-11-25): maplibre-loader.js imports the 294 KB module only when the map
     first asks for it (whenMaplibreReady in app/map.jsx) or once the page has loaded, whichever comes first, so it no
     longer competes with the sign-in landing on a slow phone connection. -->
<link href="vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet" />
<script type="module" src="maplibre-loader.js"></script>
<!-- The page's one stylesheet after MapLibre's, built by scripts/frontend-styles.js as assets/tailwind.<hash>.css:
     assets/base.css (the tokens, glass, the map container; inline here until QA plan PR F3), assets/report.css (the
     report dialog), assets/listing-claim.css, then Tailwind compiled at build time (QA plan PR F1, item S3; config:
     ../../tailwind.config.cjs) with the self-hosted fonts and the boot screen below. That is the order the separate
     links had, so the cascade is unchanged, in one request instead of four. Tailwind stays LAST: the Play CDN it
     replaced injected its rules here, and the screens were styled against that order (the two sheets the app adds
     itself at runtime still come after it). -->
<link href="assets/tailwind.css" rel="stylesheet" />
</head>
<body>
<!-- The boot screen paints with the HTML and its CSS, before any script (budget: first paint within 1.5 s on a slow
     phone connection). It is the React LoadingSplash's crown, ring and wash, so the hand-over is still; React's first
     render replaces it. -->
<div id="root"><div class="cc-boot" role="status" aria-label="Opening Citizens Connect"><img src="assets/citizens-crown.png?v=20261003a" alt="" width="72" height="39" /><span class="cc-boot-ring" aria-hidden="true"></span><p class="cc-boot-words" aria-hidden="true">Connecting the Kingdom</p></div><noscript><p class="cc-boot-words">Citizens Connect needs JavaScript to run.</p></noscript></div>

<!-- The libraries, from our own origin (QA plan PR F2, 2026-11-25), each a placeholder the build points at
     vendor/<name>.<hash>.js (scripts/frontend-vendor.js; @citizens/frontend-build `scripts`). They used to come from
     unpkg and jsDelivr: three more origins to reach on a slow phone connection before the guest button, and bytes
     OSV-Scanner never saw. Now they are the lockfile-pinned npm packages' own files:
       - lucide 1.34.0, trimmed to the icons the source names (app/icons.jsx reads window.lucide.icons[name]);
         an icon must be NAMED literally in the source, never assembled ('Arrow' + dir), or it is left out;
       - React and ReactDOM 18.3.1, the production UMD builds (npm aliases react-umd / react-dom-umd, because the
         Next app's own react is 19, which has no UMD build);
       - supabase-js, its UMD build: it runs on the page that holds people's sign-in sessions.
     All in <body>, after the boot screen, so the first paint never waits for them (PR F1). -->
<script src="vendor/lucide.js"></script>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>

<!-- Supabase auth: the client (above), runtime config, and the browser auth wrapper. -->
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<!-- The world's words, categories and switches (engine step E7): the build bundles this
     ESM entry into one hashed script. It runs before auth-client.js and the screens. -->
<script src="engine-world.js"></script>

<!-- Cache-busting for our own no-build scripts. The static host (python
     http.server / Capacitor) sends no cache headers, so browsers serve stale
     copies after edits. Bump ?v= whenever you change auth-client.js or any
     app/*.jsx so the live preview (and deployed clients) always load fresh code. -->
