name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A schedule only fires from the default branch, so it cannot be tried from a
  # PR branch; "Run workflow" (Actions tab, or `gh workflow run CI`) tests it.
  workflow_dispatch:
  schedule:
    # Daily, 02:17 UTC (04:17 in South Africa, before the 05:00 morning check):
    # a new dependency advisory turns main red the morning it appears, not when
    # the next PR is blocked. The whole workflow runs, e2e included, as a daily
    # regression check. Off the :00 minute, when scheduled runs queue longest.
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  # Keyed on the event too, so a scheduled or manual run on main and a push to
  # main do not cancel each other (they share the ref refs/heads/main).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (with coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # `pnpm audit` was retired: npm permanently removed the legacy audit
      # endpoint it calls (HTTP 410 on every pnpm version, 9.x and 10.x alike),
      # so it can no longer surface advisories. Replaced with OSV-Scanner, which
      # reads pnpm-lock.yaml against the OSV.dev database and does not depend on
      # npm's endpoint. Binary is pinned to a version + SHA-256 (supply-chain
      # hardening); it exits non-zero when any known vulnerability is found, so
      # this step blocks the build on dependency advisories. A documented
      # baseline of pre-existing advisories lives in osv-scanner.toml (temporary
      # debt to be cleared in a dedicated remediation session — see RESUME §3Z);
      # the gate still blocks any NEW advisory not in that baseline.
      - name: Audit dependencies for known vulnerabilities (OSV-Scanner)
        run: |
          OSV_VERSION="v2.3.8"
          OSV_SHA256="bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc"
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o "$RUNNER_TEMP/osv-scanner"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan --config=osv-scanner.toml -L pnpm-lock.yaml

  e2e-connect:
    name: E2E (Connect — Playwright)
    runs-on: ubuntu-latest
    # `playwright install --with-deps` runs apt. A slow mirror (about 12
    # minutes) plus the ~8 minute suite exceeds 20 and cancels the job
    # while tests are still running. The dot reporter's × is a retry, not
    # a final failure.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter citizens-connect exec playwright install --with-deps chromium

      # Only Connect's suite is wired in here: it's hermetic (mocks its own
      # auth + API + map tiles — see apps/connect/e2e/kingdom-discovery.spec.ts,
      # zero live Supabase writes, zero secrets needed). Vision's existing
      # playwright.config.ts/e2e/ predate this and currently crash on boot
      # without real Supabase env vars configured — not wired into CI until
      # that's fixed (tracked in apps/connect/RESUME_HERE.md).
      - name: Run Connect e2e
        run: pnpm --filter citizens-connect test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-connect
          path: apps/connect/playwright-report/
          retention-days: 7

      # The same app built and served under /citizens/connect (NEXT_PUBLIC_BASE_PATH), a 30-test smoke of
      # routing, history, share links, sign-in return and "no request fails". It runs after the root suite, never
      # beside it: both modes write the one generated public/ (apps/connect/playwright.base-path.config.ts).
      # About 2.5 minutes. The prefix is not set on any Vercel project yet (C39, PR D).
      - name: Run Connect e2e under /citizens/connect
        run: pnpm --filter citizens-connect test:e2e:base-path

      - name: Upload Playwright report (prefix mode)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-connect-base-path
          path: apps/connect/playwright-report-base-path/
          retention-days: 7

  # Vision's suite is hermetic: a reserved .test Supabase host, mocked
  # config.js / API / map tiles (apps/vision/e2e/support/app-shell.ts),
  # no secrets and no auth cookie. Signed-out requests do not call that host.
  e2e-vision:
    name: E2E (Vision — Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter citizens-vision exec playwright install --with-deps chromium

      - name: Run Vision e2e
        run: pnpm --filter citizens-vision test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-vision
          path: apps/vision/playwright-report/
          retention-days: 7
