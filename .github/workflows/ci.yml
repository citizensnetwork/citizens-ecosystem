name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (with coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # `pnpm audit` was retired: npm permanently removed the legacy audit
      # endpoint it calls (HTTP 410 on every pnpm version, 9.x and 10.x alike),
      # so it can no longer surface advisories. Replaced with OSV-Scanner, which
      # reads pnpm-lock.yaml against the OSV.dev database and does not depend on
      # npm's endpoint. Binary is pinned to a version + SHA-256 (supply-chain
      # hardening); it exits non-zero when any known vulnerability is found, so
      # this step blocks the build on dependency advisories. A documented
      # baseline of pre-existing advisories lives in osv-scanner.toml (temporary
      # debt to be cleared in a dedicated remediation session — see RESUME §3Z);
      # the gate still blocks any NEW advisory not in that baseline.
      - name: Audit dependencies for known vulnerabilities (OSV-Scanner)
        run: |
          OSV_VERSION="v2.3.8"
          OSV_SHA256="bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc"
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o "$RUNNER_TEMP/osv-scanner"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan --config=osv-scanner.toml -L pnpm-lock.yaml

  e2e-connect:
    name: E2E (Connect — Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter citizens-connect exec playwright install --with-deps chromium

      # Only Connect's suite is wired in here: it's hermetic (mocks its own
      # auth + API + map tiles — see apps/connect/e2e/kingdom-discovery.spec.ts,
      # zero live Supabase writes, zero secrets needed). Vision's existing
      # playwright.config.ts/e2e/ predate this and currently crash on boot
      # without real Supabase env vars configured — not wired into CI until
      # that's fixed (tracked in apps/connect/RESUME_HERE.md).
      - name: Run Connect e2e
        run: pnpm --filter citizens-connect test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-connect
          path: apps/connect/playwright-report/
          retention-days: 7
